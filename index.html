<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cursor Spotlight -->
    <div class="cursor-light"></div>

    <div class="background">

        <div class="grid"></div>

        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>

        <div class="cube cube-one">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="cube cube-two">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

    <main class="page">

        <div class="auth-card">

            <div class="logo">
                <div class="logo-icon">N</div>
                <span>Nova</span>
            </div>

            <div class="heading">

                <h1 id="formTitle" class="spotlight-text">
                    Welcome Back
                </h1>

                <p id="formDescription" class="spotlight-text">
                    Sign in to continue
                </p>

            </div>

            <!-- LOGIN -->

            <form id="loginForm">

                <div class="form-group">
                    <label>Email</label>

                    <input
                        id="loginEmail"
                        type="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <div class="password-box">

                        <input
                            id="loginPassword"
                            type="password"
                            placeholder="Password"
                            required
                        >

                        <button
                            type="button"
                            class="eye-button"
                            data-password="loginPassword"
                        >
                            👁
                        </button>

                    </div>
                </div>

                <div class="options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember
                    </label>

                    <button
                        type="button"
                        id="forgotButton"
                        class="link-button"
                    >
                        Forgot?
                    </button>

                </div>

                <button
                    class="main-button"
                    type="submit"
                >
                    Sign In →
                </button>

            </form>

            <!-- SIGNUP -->

            <form
                id="signupForm"
                class="hidden"
            >

                <div class="form-group">
                    <label>Name</label>

                    <input
                        id="signupName"
                        type="text"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Email</label>

                    <input
                        id="signupEmail"
                        type="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Password</label>

                    <div class="password-box">

                        <input
                            id="signupPassword"
                            type="password"
                            required
                        >

                        <button
                            type="button"
                            class="eye-button"
                            data-password="signupPassword"
                        >
                            👁
                        </button>

                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm</label>

                    <div class="password-box">

                        <input
                            id="confirmPassword"
                            type="password"
                            required
                        >

                        <button
                            type="button"
                            class="eye-button"
                            data-password="confirmPassword"
                        >
                            👁
                        </button>

                    </div>
                </div>

                <label class="terms">
                    <input
                        id="terms"
                        type="checkbox"
                    >
                    I agree to terms
                </label>

                <button
                    class="main-button"
                    type="submit"
                >
                    Create Account →
                </button>

            </form>

            <div class="divider">
                OR
            </div>

            <div class="social-buttons">

                <button
                    id="googleButton"
                    class="social-button"
                >
                    Google
                </button>

                <button
                    id="githubButton"
                    class="social-button"
                >
                    GitHub
                </button>

            </div>

            <div class="switch">

                <span id="switchText">
                    Don't have an account?
                </span>

                <button id="switchButton">
                    Sign Up
                </button>

            </div>

        </div>

    </main>

    <div
        id="toast"
        class="toast"
    >

        <span id="toastIcon">
            ✓
        </span>

        <span id="toastText">
            Success
        </span>

    </div>

    <script src="script.js"></script>

</body>
</html>
